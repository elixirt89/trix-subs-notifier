name: Chequeo suscriptores
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: subs-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python subs.py
        env:
          API_KEY: ${{ secrets.API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Guardar estado
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            echo "{\"count\": $(cat /tmp/current_count.txt)}" > subs_count.json
            git add subs_count.json
            if git diff --staged --quiet; then
              echo "Sin cambios que guardar"
              exit 0
            fi
            git commit -m "actualiza contador"
            if git push; then
              echo "Guardado correctamente"
              exit 0
            fi
            echo "Choque detectado, reintentando..."
            git fetch origin main
            git reset --hard origin/main
            sleep 3
          done
          echo "No se pudo guardar tras varios intentos"
          exit 1
